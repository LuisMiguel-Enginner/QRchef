<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | QRchef</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card" data-reveal>
            <a href="../index.html" class="logo">QR<span>chef</span></a>
            <h2>Comece grátis hoje</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label>Nome do Restaurante</label>
                    <input type="text" id="restaurantName" required placeholder="Ex: Burguer House" autocomplete="organization">
                </div>
                <div class="form-group">
                    <label>E-mail Profissional</label>
                    <input type="email" id="email" required placeholder="seu@email.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Crie uma Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" required placeholder="********" autocomplete="new-password">
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('password')"></i>
                    </div>
                    <div class="password-requirements">
                        <span class="requirement" id="req-length"><i class="fas fa-circle"></i> 8+ caracteres</span>
                        <span class="requirement" id="req-upper"><i class="fas fa-circle"></i> Letra maiúscula</span>
                        <span class="requirement" id="req-special"><i class="fas fa-circle"></i> Caractere especial</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirme sua Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" required placeholder="********" autocomplete="new-password">
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('confirmPassword')"></i>
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="registerBtn" style="width: 100%;">
                    <span>Criar meu cardápio agora</span>
                </button>
            </form>
            <p>Já possui uma conta? <a href="login.html">Fazer login</a></p>
        </div>
    </div>
    <script src="../js/auth.js"></script>
    <script>
        document.querySelector('.auth-card').classList.add('active');
    </script>
    <script src="../js/mobile-nav.js"></script>
</body>
</html>
