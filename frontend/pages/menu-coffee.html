<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Coffee & Co | Artisanal Menu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4E342E;
            --accent: #8D6E63;
            --bg: #FFF9F4;
            --white: #ffffff;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'DM Sans', sans-serif; background-color: var(--bg); color: var(--primary); overflow-x: hidden; padding-bottom: 120px; }
        .playfair { font-family: 'Playfair Display', serif; }

        /* Coffee Loader */
        .coffee-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 2000;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.8s ease;
        }
        .coffee-loader.hidden { opacity: 0; visibility: hidden; }
        .steam { font-size: 40px; color: var(--accent); animation: steam 2s infinite; }
        @keyframes steam {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { transform: translateY(-20px) scale(1.2); opacity: 0.5; }
            100% { transform: translateY(-40px) scale(1.5); opacity: 0; }
        }

        /* Header */
        header {
            padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 249, 244, 0.9);
            backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(78, 52, 46, 0.05);
        }
        .logo { font-size: 20px; font-weight: 700; letter-spacing: 1px; }

        /* Hero */
        .hero { padding: 60px 20px; text-align: center; background-image: url('https://www.transparenttextures.com/patterns/p6.png'); }
        .hero h1 { font-size: 42px; font-weight: 900; line-height: 1; margin-bottom: 15px; }
        .hero p { font-family: 'Playfair Display', serif; font-style: italic; color: var(--accent); font-size: 18px; }

        /* Search */
        .search-area { padding: 0 20px 30px; }
        .search-box {
            background: white; padding: 18px 25px; border-radius: 100px;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 30px rgba(78, 52, 46, 0.05);
            border: 1px solid rgba(78, 52, 46, 0.05);
        }
        .search-box input { border: none; outline: none; width: 100%; font-size: 14px; color: var(--primary); background: transparent; letter-spacing: 0.5px; }
        .search-box i { color: var(--accent); }

        /* Categories */
        .categories { display: flex; gap: 15px; padding: 0 20px 30px; overflow-x: auto; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-pill {
            padding: 12px 24px; background: white; color: var(--accent);
            border-radius: 100px; white-space: nowrap; font-weight: 600; font-size: 13px;
            cursor: pointer; transition: var(--transition); border: 1px solid rgba(78, 52, 46, 0.05);
        }
        .cat-pill.active { background: var(--primary); color: white; box-shadow: 0 8px 20px rgba(78, 52, 46, 0.2); }

        /* Menu Items */
        .menu-list { padding: 0 20px; }
        .section-title { font-size: 24px; margin-bottom: 30px; text-align: center; position: relative; }
        .section-title::after { content: '~'; display: block; color: var(--accent); font-size: 20px; margin-top: 5px; }

        .item-card {
            background: white; padding: 18px; border-radius: 30px;
            margin-bottom: 25px; display: flex; gap: 20px; align-items: center;
            box-shadow: 0 10px 30px rgba(78, 52, 46, 0.03);
            cursor: pointer; transition: var(--transition);
        }
        .item-card:hover { transform: translateY(-5px) scale(1.02); }

        .img-box { width: 95px; height: 95px; flex-shrink: 0; }
        .img-box img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

        .item-info { flex: 1; }
        .item-info h4 { font-size: 18px; font-weight: 700; margin-bottom: 5px; }
        .item-info p { font-size: 13px; color: #8d7b77; line-height: 1.4; margin-bottom: 12px; }
        
        .item-footer { display: flex; justify-content: space-between; align-items: center; }
        .item-price { font-weight: 700; font-size: 18px; color: var(--primary); }
        .add-btn {
            width: 36px; height: 36px; border-radius: 50%;
            background: #fdf5f0; color: var(--primary);
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
        }
        .item-card:hover .add-btn { background: var(--primary); color: white; }

        /* Cart Bar */
        .coffee-cart {
            position: fixed; bottom: 30px; left: 20px; right: 20px;
            background: var(--primary); color: white; padding: 20px 30px;
            border-radius: 100px; display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; box-shadow: 0 15px 40px rgba(78, 52, 46, 0.4);
            transform: translateY(150%); transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
        }
        .coffee-cart.active { transform: translateY(0); }
        .cart-info { display: flex; align-items: center; gap: 15px; }
        .cart-dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Floating WhatsApp */
        .btn-whatsapp {
            position: fixed; right: 25px; bottom: 120px; width: 55px; height: 55px;
            background: #25D366; color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; box-shadow: 0 10px 25px rgba(37, 211, 102, 0.2);
            z-index: 900; cursor: pointer; transition: var(--transition);
        }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(78, 52, 46, 0.5); backdrop-filter: blur(10px);
            z-index: 2000; display: none; align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal-card {
            background: var(--bg); width: 100%; max-width: 400px;
            padding: 40px 30px; border-radius: 40px; text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
            transform: scale(0.9); opacity: 0; transition: var(--transition);
        }
        .modal-overlay.active { display: flex; }
        .modal-overlay.active .modal-card { transform: scale(1); opacity: 1; }

        .btn-finish {
            width: 100%; padding: 20px; background: var(--primary); color: white;
            border: none; border-radius: 100px; font-weight: 700; font-size: 16px;
            margin-top: 30px; cursor: pointer;
        }
    </style>
    <link rel="stylesheet" href="../css/responsive.css">

</head>
<body>

    <div class="coffee-loader" id="loader">
        <i class="fas fa-coffee steam"></i>
    </div>

    <header>
        <div class="logo playfair">Coffee & Co</div>
        <i class="fas fa-leaf" style="color: var(--accent);"></i>
    </header>

    <section class="hero">
        <h1 class="playfair">O aroma do<br>seu dia</h1>
        <p>Momentos artesanais em cada detalhe.</p>
    </section>

    <div class="search-area">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="BUSCAR MEU CAFÉ..." onkeyup="handleSearch(this.value)">
        </div>
    </div>

    <nav class="categories" id="catNav"></nav>

    <main class="menu-list" id="menuList"></main>

    <div class="btn-whatsapp" onclick="sendWhatsApp()">
        <i class="fab fa-whatsapp"></i>
    </div>

    <div class="coffee-cart" id="coffeeCart" onclick="openSummary()">
        <div class="cart-info">
            <div class="cart-dot"></div>
            <span style="font-weight: 700; letter-spacing: 1px;">MINHA CESTA</span>
        </div>
        <div id="cartTotal" style="font-weight: 700; font-size: 20px;">R$ 0,00</div>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeSummary()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h2 class="playfair" style="font-size: 32px; margin-bottom: 25px;">Sua Cesta</h2>
            <div id="orderItems" style="margin-bottom: 30px; text-align: left;"></div>
            <div style="display:flex; justify-content:space-between; font-weight:700; font-size:22px; border-top: 1px solid #eee; padding-top: 20px;">
                <span>Total</span>
                <span id="finalTotal">R$ 0,00</span>
            </div>
            <button class="btn-finish" onclick="finishOrder()">CONCLUIR PEDIDO</button>
        </div>
    </div>

    <script>
        const menuData = {
            categories: ['Cafés', 'Boulangerie', 'Doces', 'Frios'],
            items: [
                { category: 'Cafés', name: 'Latte Macchiato', desc: 'Três camadas perfeitas: leite, café espresso e espuma densa.', price: 17.50, img: 'https://images.unsplash.com/photo-1534778101976-62847782c213?auto=format&fit=crop&w=400' },
                { category: 'Cafés', name: 'Espresso Romano', desc: 'Dose dupla de espresso com um toque de limão siciliano.', price: 11.00, img: 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?auto=format&fit=crop&w=400' },
                { category: 'Boulangerie', name: 'Croissant de Amêndoas', desc: 'Massa folhada recheada com creme frangipane e amêndoas tostadas.', price: 19.00, img: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=400' },
                { category: 'Doces', name: 'Cheesecake Frutas Vermelhas', desc: 'Receita clássica nova-iorquina com calda artesanal.', price: 22.00, img: 'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=400' },
                { category: 'Frios', name: 'Cold Brew Citrus', desc: 'Café extraído a frio por 18h com notas cítricas e gelo.', price: 18.00, img: 'https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=400' }
            ]
        };

        let cart = [];
        let currentCat = 'Cafés';

        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
                init();
            }, 1000);
        });

        function init() {
            renderCats();
            renderMenu();
        }

        function renderCats() {
            const nav = document.getElementById('catNav');
            nav.innerHTML = menuData.categories.map(c => `
                <div class="cat-pill ${c === currentCat ? 'active' : ''}" onclick="setCat('${c}')">${c}</div>
            `).join('');
        }

        function setCat(c) {
            currentCat = c;
            renderCats();
            renderMenu();
        }

        function handleSearch(val) {
            renderMenu(val);
        }

        function renderMenu(filter = '') {
            const list = document.getElementById('menuList');
            const filtered = menuData.items.filter(i => 
                (filter === '' ? i.category === currentCat : true) &&
                (i.name.toLowerCase().includes(filter.toLowerCase()) || i.desc.toLowerCase().includes(filter.toLowerCase()))
            );

            list.innerHTML = `
                <h3 class="playfair section-title">${filter ? 'Resultados' : currentCat}</h3>
                ${filtered.map(item => `
                    <div class="item-card" onclick="addToCart('${item.name}', ${item.price})">
                        <div class="img-box">
                            <img src="${item.img}">
                        </div>
                        <div class="item-info">
                            <h4>${item.name}</h4>
                            <p>${item.desc}</p>
                            <div class="item-footer">
                                <div class="item-price">R$ ${item.price.toFixed(2).replace('.', ',')}</div>
                                <div class="add-btn"><i class="fas fa-plus"></i></div>
                            </div>
                        </div>
                    </div>
                `).join('')}
            `;
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCart();
            if (window.navigator.vibrate) window.navigator.vibrate(40);
        }

        function updateCart() {
            const bar = document.getElementById('coffeeCart');
            const total = document.getElementById('cartTotal');
            if (cart.length > 0) {
                bar.classList.add('active');
                const sum = cart.reduce((acc, i) => acc + i.price, 0);
                total.innerText = `R$ ${sum.toFixed(2).replace('.', ',')}`;
            } else {
                bar.classList.remove('active');
            }
        }

        function openSummary() {
            const overlay = document.getElementById('modalOverlay');
            const items = document.getElementById('orderItems');
            const total = document.getElementById('finalTotal');
            
            items.innerHTML = cart.map(i => `
                <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:14px;">
                    <span>1x ${i.name}</span>
                    <span style="font-weight:700;">R$ ${i.price.toFixed(2).replace('.', ',')}</span>
                </div>
            `).join('');
            
            const sum = cart.reduce((acc, i) => acc + i.price, 0);
            total.innerText = `R$ ${sum.toFixed(2).replace('.', ',')}`;
            
            overlay.classList.add('active');
        }

        function closeSummary() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function finishOrder() {
            alert('Sua dose de afeto está sendo preparada.');
            cart = [];
            updateCart();
            closeSummary();
        }

        function sendWhatsApp() {
            alert('Coffee & Co: Preparando seu café artesanal!');
        }
    </script>
    <script src="../js/mobile-nav.js"></script>
</body>
</html>
