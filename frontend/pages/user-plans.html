<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Planos | QRchef</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF5C00;
            --primary-glow: rgba(255, 92, 0, 0.4);
            --black: #0D0D0D;
            --dark-gray: #151515;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body { background-color: var(--black); color: white; padding-top: 80px; }
        .dashboard-header-top {
            position: fixed; top: 0; left: 0; width: 100%; height: 80px;
            background: rgba(13, 13, 13, 0.9); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border); z-index: 1000; display: flex; align-items: center;
        }
        .header-inner { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 40px; display: flex; justify-content: space-between; align-items: center; }
        .main-content { max-width: 1000px; margin: 0 auto; padding: 40px; }
        .plan-card { 
            background: var(--dark-gray); border: 1px solid var(--glass-border); border-radius: 32px; 
            padding: 40px; position: relative; overflow: hidden;
        }
        .plan-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; }
        .plan-badge { background: var(--primary); color: white; padding: 8px 16px; border-radius: 100px; font-size: 12px; font-weight: 800; text-transform: uppercase; }
        .plan-price { font-size: 36px; font-weight: 800; color: white; }
        .plan-price span { font-size: 16px; color: var(--gray); font-weight: 400; }
        .plan-features { list-style: none; padding: 0; margin: 30px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .plan-features li { display: flex; align-items: center; gap: 10px; color: #eee; font-size: 14px; }
        .plan-features i { color: #2ecc71; }
        .btn-upgrade { background: white; color: black; border: none; padding: 16px 40px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.3s; width: 100%; }
        .btn-upgrade:hover { transform: scale(1.02); }
        .logo { font-size: 28px; font-weight: 800; text-decoration: none; color: white; }
        .logo span { color: var(--primary); }
        .avatar-circle { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 800; color: white; }
    </style>
</head>
<body>
    <header class="dashboard-header-top">
        <div class="header-inner">
            <a href="dashboard.html" class="logo">QR<span>chef</span></a>
            <div style="display: flex; align-items: center; gap: 20px;">
                <a href="admin-systems-showcase.html" style="color:var(--gray); text-decoration:none; font-size:14px; font-weight:700; transition: 0.3s;" onmouseover="this.style.color='white'" onmouseout="this.style.color='var(--gray)'">
                    <i class="fas fa-arrow-left"></i> Voltar
                </a>
                <div class="avatar-circle">P</div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <h1 class="syne" style="font-size: 32px; margin-bottom: 40px;">Meu Plano Atual</h1>
        <div class="plan-card">
            <div class="plan-header">
                <div>
                    <span class="plan-badge">Plano Pro</span>
                    <h2 style="margin-top: 15px; font-size: 24px; color: white;">Profissional em Expansão</h2>
                </div>
                <div class="plan-price">R$ 149,90 <span>/mês</span></div>
            </div>
            <ul class="plan-features">
                <li><i class="fas fa-check-circle"></i> Categorias Ilimitadas</li>
                <li><i class="fas fa-check-circle"></i> Busca Avançada</li>
                <li><i class="fas fa-check-circle"></i> Design Moderno</li>
                <li><i class="fas fa-check-circle"></i> Suporte Prioritário</li>
                <li><i class="fas fa-check-circle"></i> Multi-idioma</li>
                <li><i class="fas fa-check-circle"></i> Relatórios Mensais</li>
            </ul>
            <button class="btn-upgrade">Alterar Plano</button>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userStr = localStorage.getItem('qrchef_user');
            if (userStr) {
                const user = JSON.parse(userStr);
                document.querySelector('.avatar-circle').textContent = user.name.charAt(0).toUpperCase();
            }
        });
    </script>
</body>
</html>
