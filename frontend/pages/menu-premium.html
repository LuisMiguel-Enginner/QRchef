<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plano Premium | QRchef</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #C5A059;
            --primary-dark: #8E6F3E;
            --bg: #080808;
            --card-bg: #121212;
            --text: #ffffff;
            --text-muted: #888888;
            --gold-gradient: linear-gradient(135deg, #C5A059 0%, #F1D39A 50%, #8E6F3E 100%);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Syne', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: var(--bg); 
            color: var(--text); 
            padding-bottom: 120px;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .playfair { font-family: 'Playfair Display', serif; }

        /* Premium Loader */
        .premium-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        .premium-loader.hidden { opacity: 0; visibility: hidden; }
        .loader-logo {
            width: 80px; height: 80px;
            border: 2px solid var(--primary);
            position: relative;
            animation: rotate 2s infinite ease-in-out;
        }
        @keyframes rotate {
            0% { transform: rotate(0) scale(1); border-radius: 0; }
            50% { transform: rotate(180deg) scale(1.2); border-radius: 50%; border-color: #fff; }
            100% { transform: rotate(360deg) scale(1); border-radius: 0; }
        }

        header {
            padding: 25px 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
        }

        .logo { 
            font-weight: 800; font-size: 18px; letter-spacing: 4px; 
            text-transform: uppercase; background: var(--gold-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .top-controls { display: flex; gap: 15px; align-items: center; }
        .lang-btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 6px 12px; border-radius: 100px;
            font-size: 10px; font-weight: 800; color: var(--primary);
            cursor: pointer;
        }

        /* Hero */
        .hero { 
            padding: 60px 20px; text-align: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #080808 100%);
            border-bottom: 1px solid var(--glass-border);
        }
        .hero span { 
            display: block; font-size: 12px; letter-spacing: 4px; 
            text-transform: uppercase; color: var(--primary); margin-bottom: 15px;
        }
        .hero h1 { font-size: 42px; font-weight: 400; font-style: italic; margin-bottom: 10px; }
        .hero p { color: var(--text-muted); font-size: 14px; letter-spacing: 1px; }

        /* Search */
        .search-container { padding: 30px 20px 0; }
        .search-bar {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 18px 25px;
            display: flex; align-items: center; gap: 15px;
            transition: var(--transition);
        }
        .search-bar:focus-within { border-color: var(--primary); background: rgba(197, 160, 89, 0.05); }
        .search-bar input {
            background: transparent; border: none; outline: none;
            color: #fff; width: 100%; font-size: 13px; letter-spacing: 1px;
            text-transform: uppercase;
        }
        .search-bar i { color: var(--primary); }

        /* Categories */
        .categories {
            display: flex; gap: 30px; padding: 30px 20px;
            overflow-x: auto; scrollbar-width: none;
            position: sticky; top: 78px; background: rgba(8,8,8,0.9);
            backdrop-filter: blur(10px); z-index: 90;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-pill {
            font-size: 11px; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; transition: var(--transition);
            white-space: nowrap; padding-bottom: 5px;
            border-bottom: 1px solid transparent;
        }
        .cat-pill.active { color: var(--primary); border-bottom-color: var(--primary); }

        /* Items */
        .menu-items { padding: 0 20px; }
        .item-card {
            display: flex; gap: 25px; padding: 40px 0;
            border-bottom: 1px solid var(--glass-border);
            transition: var(--transition);
            cursor: pointer; position: relative;
        }
        .item-card:hover { transform: translateX(10px); }
        
        .item-img-container {
            width: 110px; height: 110px; flex-shrink: 0;
            position: relative; border: 1px solid var(--glass-border);
            padding: 5px;
        }
        .item-img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.5); transition: var(--transition); }
        .item-card:hover .item-img { filter: grayscale(0); }

        .item-info { flex: 1; }
        .item-info h4 { font-size: 18px; letter-spacing: 1px; margin-bottom: 8px; font-weight: 500; }
        .item-info p { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 15px; font-family: 'Syne'; }
        
        .item-footer { display: flex; justify-content: space-between; align-items: center; }
        .item-price { font-weight: 800; font-size: 20px; color: var(--primary); }
        .btn-add {
            width: 30px; height: 30px; border: 1px solid var(--primary);
            color: var(--primary); display: flex; align-items: center; justify-content: center;
            font-size: 12px; transition: var(--transition);
        }
        .item-card:hover .btn-add { background: var(--primary); color: #000; }

        .chef-badge {
            font-size: 9px; font-weight: 800; color: var(--primary);
            text-transform: uppercase; letter-spacing: 2px;
            display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
        }

        /* Cart Bar */
        .cart-bar {
            position: fixed; bottom: 30px; left: 20px; right: 20px;
            background: var(--gold-gradient); color: #000;
            padding: 22px 30px; display: flex; justify-content: space-between;
            align-items: center; z-index: 200; cursor: pointer;
            transform: translateY(150%); transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .cart-bar.active { transform: translateY(0); }
        .cart-bar span { font-weight: 800; letter-spacing: 2px; font-size: 12px; }
        .cart-price { font-family: 'Syne'; font-size: 18px; font-weight: 900; }

        /* Floating Actions */
        .floating-actions {
            position: fixed; right: 25px; bottom: 120px;
            display: flex; flex-direction: column; gap: 20px; z-index: 150;
        }
        .action-btn {
            width: 55px; height: 55px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; cursor: pointer; transition: var(--transition);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }
        .btn-waiter { background: var(--glass); color: var(--primary); }
        .btn-waiter.calling { animation: pulse-gold 1.5s infinite; background: var(--primary); color: #000; }
        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(197, 160, 89, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(197, 160, 89, 0); }
            100% { box-shadow: 0 0 0 0 rgba(197, 160, 89, 0); }
        }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 500;
            display: none; opacity: 0; transition: var(--transition);
        }
        .modal-overlay.active { display: block; opacity: 1; }
        
        .modal-content {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #0a0a0a; border-top: 1px solid var(--primary);
            padding: 50px 30px; transform: translateY(100%);
            transition: var(--transition); z-index: 501;
        }
        .modal-overlay.active + .modal-content { transform: translateY(0); }

        .btn-finish {
            width: 100%; padding: 25px; background: var(--gold-gradient);
            color: #000; border: none; font-weight: 900; font-size: 14px;
            letter-spacing: 3px; text-transform: uppercase; cursor: pointer;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="premium-loader" id="loader">
        <div class="loader-logo"></div>
    </div>

    <header>
        <div class="logo">BLACK STEAK</div>
        <div class="top-controls">
            <div class="lang-btn">PT</div>
            <i class="fas fa-bars" style="color: var(--primary); font-size: 18px;"></i>
        </div>
    </header>

    <section class="hero">
        <span>The Exclusive Club</span>
        <h1 class="playfair">Cortes Autorais</h1>
        <p>A ARTE DA GASTRONOMIA EM CADA DETALHE</p>
    </section>

    <div class="search-container">
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="BUSCAR NO MENU EXCLUSIVO..." onkeyup="handleSearch(this.value)">
        </div>
    </div>

    <nav class="categories" id="categoryNav"></nav>

    <main class="menu-items" id="itemsContainer"></main>

    <div class="floating-actions">
        <div class="action-btn btn-waiter" onclick="callWaiter(this)">
            <i class="fas fa-concierge-bell"></i>
        </div>
        <div class="action-btn" style="background: #25D366; color: white;" onclick="alert('WhatsApp Premium Ativo!')">
            <i class="fab fa-whatsapp"></i>
        </div>
    </div>

    <div class="cart-bar" id="cartBar" onclick="openCheckout()">
        <span>FINALIZAR EXPERIÊNCIA</span>
        <div class="cart-price" id="cartTotal">R$ 0,00</div>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeCheckout()"></div>
    <div class="modal-content" id="checkoutModal">
        <h2 class="playfair" style="text-align: center; margin-bottom: 40px; letter-spacing: 3px;">RESUMO DA EXPERIÊNCIA</h2>
        <div id="orderSummary"></div>
        <div style="display:flex; justify-content:space-between; margin-top:30px; padding-top:20px; border-top:1px solid #222;">
            <span style="font-weight: 800; letter-spacing: 2px;">TOTAL</span>
            <span id="finalTotal" style="color:var(--primary); font-weight:900; font-size:24px;">R$ 0,00</span>
        </div>
        <button class="btn-finish" onclick="finishOrder()">CONFIRMAR PEDIDO</button>
    </div>

    <script>
        const menuData = {
            categories: ['Cortes Nobres', 'Entradas de Luxo', 'Mixologia'],
            items: [
                { category: 'Cortes Nobres', name: 'Wagyu A5 Kobe Style', desc: 'O mais alto nível de marmoreio do mundo, selado na brasa de carvalho.', price: 480.00, chef: true, img: 'https://images.unsplash.com/photo-1603360946369-dc9bb6258143?auto=format&fit=crop&w=400' },
                { category: 'Cortes Nobres', name: 'Tomahawk Black Angus', desc: 'Corte de 900g acompanhado de manteiga de ervas finas e flor de sal.', price: 320.00, img: 'https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=400' },
                { category: 'Entradas de Luxo', name: 'Tartare de Atum Bluefin', desc: 'Com raspas de trufa negra e gema de ovo caipira confitada.', price: 115.00, chef: true, img: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=400' },
                { category: 'Mixologia', name: 'Golden Negroni', desc: 'Gin premium, Vermouth branco e ouro 24k comestível.', price: 75.00, img: 'https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=400' }
            ]
        };

        let cart = [];
        let currentCategory = 'Cortes Nobres';

        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
                init();
            }, 1200);
        });

        function init() {
            renderCategories();
            renderItems();
        }

        function renderCategories() {
            const nav = document.getElementById('categoryNav');
            nav.innerHTML = menuData.categories.map(cat => `
                <div class="cat-pill ${cat === currentCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</div>
            `).join('');
        }

        function setCategory(cat) {
            currentCategory = cat;
            renderCategories();
            renderItems();
        }

        function handleSearch(val) {
            renderItems(val);
        }

        function renderItems(filter = '') {
            const container = document.getElementById('itemsContainer');
            const filtered = menuData.items.filter(i => 
                (filter === '' ? i.category === currentCategory : true) &&
                (i.name.toLowerCase().includes(filter.toLowerCase()) || i.desc.toLowerCase().includes(filter.toLowerCase()))
            );

            container.innerHTML = filtered.map(item => `
                <div class="item-card" onclick="addToCart('${item.name}', ${item.price})">
                    <div class="item-img-container">
                        <img src="${item.img}" class="item-img">
                    </div>
                    <div class="item-info">
                        ${item.chef ? `<div class="chef-badge"><i class="fas fa-crown"></i> Chef's Choice</div>` : ''}
                        <h4>${item.name}</h4>
                        <p>${item.desc}</p>
                        <div class="item-footer">
                            <div class="item-price">R$ ${item.price.toFixed(2).replace('.', ',')}</div>
                            <div class="btn-add"><i class="fas fa-plus"></i></div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartBar();
        }

        function updateCartBar() {
            const bar = document.getElementById('cartBar');
            const total = document.getElementById('cartTotal');
            if (cart.length > 0) {
                bar.classList.add('active');
                const sum = cart.reduce((acc, i) => acc + i.price, 0);
                total.innerText = `R$ ${sum.toFixed(2).replace('.', ',')}`;
            } else {
                bar.classList.remove('active');
            }
        }

        function openCheckout() {
            const overlay = document.getElementById('modalOverlay');
            const summary = document.getElementById('orderSummary');
            const total = document.getElementById('finalTotal');
            
            summary.innerHTML = cart.map(i => `
                <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-size:11px; letter-spacing:1px; text-transform:uppercase;">
                    <span>${i.name}</span>
                    <span style="font-weight:800;">R$ ${i.price.toFixed(2).replace('.', ',')}</span>
                </div>
            `).join('');
            
            const sum = cart.reduce((acc, i) => acc + i.price, 0);
            total.innerText = `R$ ${sum.toFixed(2).replace('.', ',')}`;
            
            overlay.classList.add('active');
        }

        function closeCheckout() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function callWaiter(btn) {
            btn.classList.add('calling');
            alert('Um concierge está a caminho da sua mesa.');
            setTimeout(() => btn.classList.remove('calling'), 5000);
        }

        function finishOrder() {
            alert('Pedido confirmado. Sua experiência gastronômica começou.');
            cart = [];
            updateCartBar();
            closeCheckout();
        }
    </script>
    <script src="../js/mobile-nav.js"></script>
</body>
</html>
