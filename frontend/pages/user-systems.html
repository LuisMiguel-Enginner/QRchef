<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Sistemas | QRchef</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF5C00;
            --primary-glow: rgba(255, 92, 0, 0.4);
            --black: #0D0D0D;
            --dark-gray: #151515;
            --glass-border: rgba(255, 255, 255, 0.1);
            --success: #2ecc71;
        }

        body {
            background-color: var(--black);
            color: white;
            padding-top: 80px;
        }

        .dashboard-header-top {
            position: fixed; top: 0; left: 0; width: 100%; height: 80px;
            background: rgba(13, 13, 13, 0.9); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border); z-index: 1000; display: flex; align-items: center;
        }

        .header-inner { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 40px; display: flex; justify-content: space-between; align-items: center; }

        .main-content { max-width: 1200px; margin: 0 auto; padding: 40px; }

        /* Stats Row */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--dark-gray);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-value { font-size: 28px; font-weight: 800; color: white; }
        .stat-label { font-size: 13px; color: var(--gray); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Controls Row */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .search-box {
            position: relative;
            width: 350px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 45px;
            background: var(--dark-gray);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            color: white;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        .btn-new-system {
            background: var(--primary);
            color: white;
            padding: 14px 25px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 800;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-new-system:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px var(--primary-glow);
        }

        /* Systems Grid */
        .systems-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        .system-card {
            background: var(--dark-gray);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 30px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 30px;
            align-items: center;
            transition: 0.3s;
        }

        .system-card:hover {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.02);
        }

        .system-preview {
            width: 120px;
            height: 120px;
            background: #222;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: var(--primary);
            border: 1px solid var(--glass-border);
        }

        .system-main-info h3 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .system-tags {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tag {
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .tag-status { background: rgba(46, 204, 113, 0.1); color: var(--success); }
        .tag-template { background: rgba(255, 255, 255, 0.05); color: #ccc; }

        .system-details-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .detail-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .detail-label { font-size: 11px; color: var(--gray); font-weight: 700; text-transform: uppercase; }
        .detail-value { font-size: 14px; font-weight: 700; color: white; }

        .system-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-action {
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-manage { background: var(--primary); color: white; }
        .btn-view { background: rgba(255, 255, 255, 0.05); color: white; border: 1px solid var(--glass-border); }
        .btn-config { background: transparent; color: var(--gray); font-size: 18px; padding: 10px; }

        .btn-action:hover { filter: brightness(1.1); }
        .btn-view:hover { border-color: white; }

        /* Modal QR Code */
        .qr-modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px); z-index: 2000; justify-content: center; align-items: center; padding: 20px;
        }
        .qr-modal.active { display: flex; }
        .qr-content {
            background: var(--dark-gray); border: 1px solid var(--glass-border); border-radius: 32px;
            padding: 40px; text-align: center; max-width: 400px; width: 100%;
        }
        #qrImage { width: 250px; height: 250px; background: white; margin: 20px auto; padding: 10px; border-radius: 15px; }

        .logo { font-size: 28px; font-weight: 800; text-decoration: none; color: white; }
        .logo span { color: var(--primary); }
        .avatar-circle { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 800; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <header class="dashboard-header-top">
        <div class="header-inner">
            <a href="dashboard.html" class="logo">QR<span>chef</span></a>
            <div style="display: flex; align-items: center; gap: 20px;">
                <a href="admin-systems-showcase.html" style="color:var(--gray); text-decoration:none; font-size:14px; font-weight:700; transition: 0.3s;" onmouseover="this.style.color='white'" onmouseout="this.style.color='var(--gray)'">
                    <i class="fas fa-arrow-left"></i> Voltar
                </a>
                <div class="avatar-circle" id="userAvatar">P</div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="controls-row">
            <h1 class="syne" style="font-size: 32px;">Meus Sistemas</h1>
            <a href="admin-systems-showcase.html" class="btn-new-system">
                <i class="fas fa-plus"></i> Novo Cardápio
            </a>
        </div>

        <!-- Quick Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Sistemas Ativos</span>
                <span class="stat-value" id="statActive">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Total de Itens</span>
                <span class="stat-value" id="statItems">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Visualizações (Mês)</span>
                <span class="stat-value">--</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Pedidos Hoje</span>
                <span class="stat-value">--</span>
            </div>
        </div>

        <div class="controls-row">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar sistema pelo nome..." oninput="filterSystems()">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-view" style="padding: 10px 15px;"><i class="fas fa-filter"></i></button>
            </div>
        </div>

        <div id="systemsContainer" class="systems-grid">
            <p style="text-align: center; color: var(--gray); padding: 40px;">Carregando seus sistemas...</p>
        </div>
    </main>

    <!-- Modal QR Code -->
    <div id="qrModal" class="qr-modal" onclick="closeQR()">
        <div class="qr-content" onclick="event.stopPropagation()">
            <h3 class="syne">Seu QR Code</h3>
            <p style="color: var(--gray); font-size: 13px; margin-top: 5px;">Aponte a câmera para abrir o cardápio</p>
            <div id="qrImage"></div>
            <button class="btn-orange" style="width: 100%;" onclick="downloadQR()">Baixar QR Code</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const API = 'https://qrchef-worker.luismiguelgomesoliveira-014.workers.dev';
        let allSystems = [];
        let qrGenerator = null;

        async function loadSystems() {
            const token = localStorage.getItem('qrchef_token');
            const userStr = localStorage.getItem('qrchef_user');
            
            if (!token) { window.location.href = 'login.html'; return; }
            if (userStr) {
                const user = JSON.parse(userStr);
                document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();
            }

            try {
                const res = await fetch(`${API}/restaurant/mine`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (data.success) {
                    allSystems = data.restaurants;
                    renderSystems(allSystems);
                    updateStats(allSystems);
                }
            } catch (e) {
                console.error('Erro ao carregar sistemas:', e);
                document.getElementById('systemsContainer').innerHTML = '<p style="color: #ff4757; text-align: center;">Erro ao conectar com o servidor.</p>';
            }
        }

        function renderSystems(systems) {
            const container = document.getElementById('systemsContainer');
            if (systems.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--gray); padding: 40px;">Nenhum sistema encontrado.</p>';
                return;
            }

            container.innerHTML = systems.map(sys => `
                <div class="system-card">
                    <div class="system-preview" style="background: ${sys.cor_primaria}22;">
                        <i class="fas fa-utensils" style="color: ${sys.cor_primaria}"></i>
                    </div>
                    
                    <div class="system-main-info">
                        <div class="system-tags">
                            <span class="tag tag-status">${sys.ativo ? 'Ativo' : 'Inativo'}</span>
                            <span class="tag tag-template">Template Padrão</span>
                        </div>
                        <h3>${sys.nome}</h3>
                        
                        <div class="system-details-grid">
                            <div class="detail-box">
                                <span class="detail-label">Criado em</span>
                                <span class="detail-value">${new Date(sys.created_at).toLocaleDateString('pt-BR')}</span>
                            </div>
                            <div class="detail-box">
                                <span class="detail-label">Slug</span>
                                <span class="detail-value">${sys.slug}</span>
                            </div>
                            <div class="detail-box">
                                <span class="detail-label">Link Público</span>
                                <a href="https://qrchef-worker.luismiguelgomesoliveira-014.workers.dev/cardapio/${sys.slug}" target="_blank" class="detail-value" style="color: var(--primary); text-decoration: none; font-size: 12px; word-break: break-all;">
                                    qrchef.dev/cardapio/${sys.slug}
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="system-actions">
                        <a href="admin-edit-menu.html?slug=${sys.slug}" class="btn-action btn-manage">
                            <i class="fas fa-pen"></i> Gerenciar Itens
                        </a>
                        <a href="https://qrchef-worker.luismiguelgomesoliveira-014.workers.dev/cardapio/${sys.slug}" target="_blank" class="btn-action btn-view">
                            <i class="fas fa-external-link-alt"></i> Ver Online
                        </a>
                        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 5px;">
                            <button class="btn-config" title="QR Code" onclick="showQR('${sys.slug}')"><i class="fas fa-qrcode"></i></button>
                            <button class="btn-config" title="Configurações" onclick="alert('Configurações do restaurante em breve!')"><i class="fas fa-cog"></i></button>
                            <button class="btn-config" title="Estatísticas" onclick="alert('Métricas detalhadas em breve!')"><i class="fas fa-chart-line"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterSystems() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allSystems.filter(sys => sys.nome.toLowerCase().includes(query));
            renderSystems(filtered);
        }

        function updateStats(systems) {
            document.getElementById('statActive').textContent = systems.filter(s => s.ativo).length.toString().padStart(2, '0');
            // Como não temos contagem de itens por restaurante aqui, mostramos um -- ou buscamos depois
            document.getElementById('statItems').textContent = '--';
        }

        function showQR(slug) {
            const url = `https://qrchef-worker.luismiguelgomesoliveira-014.workers.dev/cardapio/${slug}`;
            const qrContainer = document.getElementById('qrImage');
            qrContainer.innerHTML = '';
            
            new QRCode(qrContainer, {
                text: url,
                width: 250,
                height: 250,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            document.getElementById('qrModal').classList.add('active');
        }

        function closeQR() {
            document.getElementById('qrModal').classList.remove('active');
        }

        function downloadQR() {
            const img = document.querySelector('#qrImage img');
            if (img) {
                const link = document.createElement('a');
                link.download = 'qrcode-cardapio.png';
                link.href = img.src;
                link.click();
            }
        }

        document.addEventListener('DOMContentLoaded', loadSystems);
    </script>
</body>
</html>
