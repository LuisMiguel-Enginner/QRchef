<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Editar Cardápio | Admin QRchef</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: var(--black); margin: 0; padding: 0; color: white; }
        
        .main-content {
            padding: 130px 40px 60px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .edit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
        }

        .restaurant-info h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .restaurant-info p {
            color: var(--gray);
            font-size: 14px;
        }

        .add-item-card {
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 40px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 12px;
            color: var(--gray);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input, .form-group select, .form-group textarea {
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .form-group textarea {
            height: 100px;
            resize: none;
        }

        .btn-add {
            grid-column: span 2;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .item-row {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
        }

        .item-image {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            object-fit: cover;
        }

        .item-details {
            flex-grow: 1;
        }

        .item-name {
            font-weight: 700;
            font-size: 16px;
        }

        .item-cat {
            font-size: 12px;
            color: var(--primary);
            font-weight: 800;
            text-transform: uppercase;
        }

        .item-price {
            font-weight: 800;
            color: white;
        }
        .item-actions { display: flex; gap: 8px; }
        .item-actions button {
            padding: 10px 12px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            color: white;
            cursor: pointer;
        }
        .item-actions button:hover { background: var(--primary); }
        .form-actions { grid-column: span 2; display: flex; gap: 12px; }
        .form-actions .btn-add { flex: 1; }
        .btn-cancel {
            padding: 14px 20px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            background: transparent;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
        /* Profile Area */
        .header-profile { display: flex; align-items: center; gap: 15px; padding-left: 20px; border-left: 1px solid rgba(255,255,255,0.1); }
        .avatar-circle { 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            background: linear-gradient(135deg, var(--primary), #ff8c00); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 800; 
            color: white; 
            cursor: pointer; 
            transition: 0.3s;
        }
        .avatar-circle:hover { transform: scale(1.05); }

        /* Side Drawer Menu */
        .side-drawer {
            position: fixed;
            top: 0;
            right: -320px;
            width: 320px;
            height: 100%;
            background: #0d0d0d;
            border-left: 1px solid rgba(255,255,255,0.1);
            z-index: 2000;
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            display: flex;
            flex-direction: column;
            padding: 40px 30px;
            box-shadow: -20px 0 50px rgba(0,0,0,0.5);
        }

        .side-drawer.active { transform: translateX(-320px); }

        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 1999;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .drawer-overlay.active { display: block; opacity: 1; }

        .drawer-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 40px;
        }

        .drawer-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #ff8c00);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
            color: white;
            margin-bottom: 15px;
        }

        .drawer-user-name { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
        .drawer-user-email { font-size: 13px; color: var(--gray); }

        .drawer-menu { display: flex; flex-direction: column; gap: 10px; }

        .drawer-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            border-radius: 12px;
            transition: 0.3s;
            background: rgba(255, 255, 255, 0.03);
        }

        .drawer-item:hover { background: rgba(255, 255, 255, 0.07); color: var(--primary); transform: translateX(5px); }
        .drawer-item i { width: 20px; font-size: 18px; text-align: center; }

        .drawer-footer { margin-top: auto; padding-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); }

        .btn-drawer-logout {
            width: 100%;
            padding: 15px;
            background: rgba(255, 71, 87, 0.1);
            color: #ff4757;
            border: 1px solid rgba(255, 71, 87, 0.2);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-drawer-logout:hover { background: #ff4757; color: white; }
    </style>
    <link rel="stylesheet" href="../css/responsive.css">

</head>
<body>
    <header class="dashboard-header-top">
        <div class="header-inner">
            <a href="dashboard.html" class="logo">QR<span>chef</span></a>
            <div class="header-profile">
                <a href="admin-systems-showcase.html" style="color:white; text-decoration:none; font-size:13px; font-weight:700; margin-right:20px;">
                    <i class="fas fa-arrow-left"></i> Voltar
                </a>
                <div class="avatar-circle" onclick="toggleDrawer()">A</div>
            </div>
        </div>
    </header>

    <!-- Side Drawer Menu -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
    <div class="side-drawer" id="sideDrawer">
        <div class="drawer-header">
            <div class="drawer-avatar" id="drawerAvatar">A</div>
            <span class="drawer-user-name" id="drawerUserName">Carregando...</span>
            <span class="drawer-user-email" id="drawerUserEmail">...</span>
        </div>

        <nav class="drawer-menu">
            <a href="profile.html" class="drawer-item">
                <i class="fas fa-user-circle"></i>
                Meu Perfil
            </a>
            <a href="user-systems.html" class="drawer-item">
                <i class="fas fa-th-large"></i>
                Meus Sistemas
            </a>
            <a href="user-plans.html" class="drawer-item">
                <i class="fas fa-credit-card"></i>
                Meus Planos
            </a>
            <a href="settings.html" class="drawer-item">
                <i class="fas fa-cog"></i>
                Configurações
            </a>
        </nav>

        <div class="drawer-footer">
            <button class="btn-drawer-logout" onclick="AuthService.logout()">
                <i class="fas fa-power-off"></i>
                Sair da Conta
            </button>
        </div>
    </div>

    <main class="main-content">
        <div class="edit-header">
            <div class="restaurant-info">
                <h1 id="resNome">Carregando...</h1>
                <p id="resLink">Gerenciando itens do seu cardápio digital</p>
            </div>
            <a id="btnVerCardapio" href="#" target="_blank" class="btn-primary" style="padding: 12px 24px; text-decoration:none; font-size:13px;">
                <i class="fas fa-external-link-alt"></i> Ver Cardápio
            </a>
        </div>

        <div class="add-item-card">
            <h2 id="formTitle" style="font-size:20px; font-weight:800;">Adicionar Novo Item</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Nome do Produto</label>
                    <input id="itemNome" type="text" placeholder="Ex: Pizza Calabresa" required>
                </div>
                <div class="form-group">
                    <label>Categoria</label>
                    <input id="itemCat" type="text" placeholder="Ex: Pizzas, Bebidas, Sobremesas" required>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Descrição (Ingredientes)</label>
                    <textarea id="itemDesc" placeholder="Descreva os detalhes do produto..."></textarea>
                </div>
                <div class="form-group">
                    <label>Preço (R$)</label>
                    <input id="itemPreco" type="number" min="0" step="0.01" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label>URL da Imagem (Opcional)</label>
                    <input id="itemFoto" type="text" placeholder="https://imagem.jpg">
                </div>
                <div class="form-actions">
                    <button type="button" onclick="salvarItem()" id="btnSalvar" class="btn-add">
                        <i class="fas fa-plus-circle"></i> Adicionar ao Cardápio
                    </button>
                    <button type="button" onclick="cancelarEdicao()" id="btnCancelar" class="btn-cancel" hidden>Cancelar</button>
                </div>
            </div>
        </div>

        <h2 style="font-size:20px; font-weight:800; margin-bottom:20px;">Itens Cadastrados</h2>
        <div id="listaItens" class="items-list">
            <!-- Itens serão carregados aqui -->
            <p style="color:#888; text-align:center; padding:40px;">Carregando seus itens...</p>
        </div>
    </main>

    <script>
        const API = 'https://qrchef-worker.luismiguelgomesoliveira-014.workers.dev';
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');
        const token = localStorage.getItem('qrchef_token');
        let itemEditId = null;

        function toggleDrawer() {
            const drawer = document.getElementById('sideDrawer');
            const overlay = document.getElementById('drawerOverlay');
            drawer.classList.toggle('active');
            overlay.classList.toggle('active');
            
            if (drawer.classList.contains('active')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = '';
            }
        }

        if (!slug || !token) {
            window.location.href = 'admin-systems-showcase.html';
        }

        async function carregarDados() {
            const userStr = localStorage.getItem('qrchef_user');
            if (userStr) {
                const user = JSON.parse(userStr);
                document.querySelector('.avatar-circle').textContent = user.name.charAt(0).toUpperCase();
                document.getElementById('drawerUserName').textContent = user.name;
                document.getElementById('drawerUserEmail').textContent = user.email;
                document.getElementById('drawerAvatar').textContent = user.name.charAt(0).toUpperCase();
            }

            try {
                // Busca os restaurantes do usuário para pegar o nome
                const res = await fetch(`${API}/restaurant/mine`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (!res.ok || !data.success) throw new Error(data.message || 'Não foi possível carregar o restaurante.');
                const restaurant = data.restaurants.find(r => r.slug === slug);
                
                if (restaurant) {
                    document.getElementById('resNome').textContent = restaurant.nome;
                    const link = `https://qrchef-worker.luismiguelgomesoliveira-014.workers.dev/cardapio/${slug}`;
                    document.getElementById('btnVerCardapio').href = link;
                } else {
                    throw new Error('Restaurante não encontrado para esta conta.');
                }

                await carregarItens();
            } catch (e) {
                console.error(e);
                document.getElementById('listaItens').textContent = e.message || 'Erro ao carregar os dados.';
            }
        }

        async function carregarItens() {
            const res = await fetch(`${API}/restaurant/${encodeURIComponent(slug)}/items`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (!res.ok || !data.success) throw new Error(data.message || 'Não foi possível carregar os itens.');

            const lista = document.getElementById('listaItens');
            lista.replaceChildren();
            if (!data.items.length) {
                lista.textContent = 'Nenhum item cadastrado ainda.';
                return;
            }

            data.items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'item-row';

                if (item.foto_url) {
                    const image = document.createElement('img');
                    image.className = 'item-image';
                    image.src = item.foto_url;
                    image.alt = item.nome;
                    row.appendChild(image);
                }

                const details = document.createElement('div');
                details.className = 'item-details';
                const name = document.createElement('div');
                name.className = 'item-name';
                name.textContent = item.nome;
                const category = document.createElement('div');
                category.className = 'item-cat';
                category.textContent = item.categoria;
                const description = document.createElement('div');
                description.textContent = item.descricao || '';
                const price = document.createElement('div');
                price.className = 'item-price';
                price.textContent = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(item.preco);
                details.append(name, category, description, price);
                row.appendChild(details);

                const actions = document.createElement('div');
                actions.className = 'item-actions';
                const editButton = document.createElement('button');
                editButton.type = 'button';
                editButton.title = 'Editar item';
                editButton.innerHTML = '<i class="fas fa-pen"></i>';
                editButton.addEventListener('click', () => editarItem(item));
                const deleteButton = document.createElement('button');
                deleteButton.type = 'button';
                deleteButton.title = 'Excluir item';
                deleteButton.innerHTML = '<i class="fas fa-trash"></i>';
                deleteButton.addEventListener('click', () => excluirItem(item));
                actions.append(editButton, deleteButton);
                row.appendChild(actions);
                lista.appendChild(row);
            });
        }

        async function salvarItem() {
            const nome = document.getElementById('itemNome').value.trim();
            const categoria = document.getElementById('itemCat').value.trim();
            const descricao = document.getElementById('itemDesc').value.trim();
            const preco = Number(document.getElementById('itemPreco').value);
            const foto_url = document.getElementById('itemFoto').value.trim();

            if (!nome || !categoria || !Number.isFinite(preco) || preco < 0 ||
                document.getElementById('itemPreco').value === '') {
                alert('Informe nome, categoria e um preço válido.');
                return;
            }

            const btn = document.getElementById('btnSalvar');
            btn.disabled = true;
            const editando = itemEditId !== null;

            try {
                const endpoint = editando
                    ? `${API}/restaurant/${encodeURIComponent(slug)}/items/${itemEditId}`
                    : `${API}/restaurant/${encodeURIComponent(slug)}/items`;
                const res = await fetch(endpoint, {
                    method: editando ? 'PUT' : 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ nome, categoria, descricao, preco, foto_url })
                });

                const data = await res.json();
                if (!res.ok || !data.success) throw new Error(data.message || 'Não foi possível salvar o item.');
                alert(editando ? 'Item atualizado com sucesso!' : 'Item adicionado com sucesso!');
                cancelarEdicao();
                await carregarItens();
            } catch (e) {
                alert(e.message || 'Erro ao conectar ao servidor.');
            } finally {
                btn.disabled = false;
                atualizarBotaoSalvar();
            }
        }

        function editarItem(item) {
            itemEditId = item.id;
            document.getElementById('itemNome').value = item.nome || '';
            document.getElementById('itemCat').value = item.categoria || '';
            document.getElementById('itemDesc').value = item.descricao || '';
            document.getElementById('itemPreco').value = item.preco;
            document.getElementById('itemFoto').value = item.foto_url || '';
            document.getElementById('formTitle').textContent = 'Editar Item';
            document.getElementById('btnCancelar').hidden = false;
            atualizarBotaoSalvar();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicao() {
            itemEditId = null;
            document.getElementById('itemNome').value = '';
            document.getElementById('itemCat').value = '';
            document.getElementById('itemDesc').value = '';
            document.getElementById('itemPreco').value = '';
            document.getElementById('itemFoto').value = '';
            document.getElementById('formTitle').textContent = 'Adicionar Novo Item';
            document.getElementById('btnCancelar').hidden = true;
            atualizarBotaoSalvar();
        }

        function atualizarBotaoSalvar() {
            const btn = document.getElementById('btnSalvar');
            btn.innerHTML = itemEditId === null
                ? '<i class="fas fa-plus-circle"></i> Adicionar ao Cardápio'
                : '<i class="fas fa-save"></i> Salvar Alterações';
        }

        async function excluirItem(item) {
            if (!confirm(`Excluir "${item.nome}" do cardápio?`)) return;
            try {
                const res = await fetch(`${API}/restaurant/${encodeURIComponent(slug)}/items/${item.id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (!res.ok || !data.success) throw new Error(data.message || 'Não foi possível excluir o item.');
                if (itemEditId === item.id) cancelarEdicao();
                await carregarItens();
            } catch (e) {
                alert(e.message || 'Erro ao conectar ao servidor.');
            }
        }

        carregarDados();
    </script>
    <script src="../js/mobile-nav.js"></script>
</body>
</html>
