<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | QRchef</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card" data-reveal>
            <a href="../index.html" class="logo">QR<span>chef</span></a>
            <h2>Acesse seu painel</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Seu E-mail</label>
                    <input type="email" id="email" required placeholder="seu@email.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Sua Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" required placeholder="********" autocomplete="current-password">
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('password')"></i>
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="loginBtn" style="width: 100%;">
                    <span>Entrar no Sistema</span>
                </button>
            </form>
            <p>Ainda não tem conta? <a href="register.html">Cadastre seu restaurante</a></p>
        </div>
    </div>
    <script src="../js/auth.js"></script>
    <script>
        document.querySelector('.auth-card').classList.add('active');
    </script>
</body>
</html>
